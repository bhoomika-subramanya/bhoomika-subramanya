  <circle cx="930" cy="200" r="90" fill="#ffffff" opacity="0.10"/>
  <circle cx="820" cy="40" r="35" fill="#ffffff" opacity="0.12"/>
  <circle cx="160" cy="215" r="28" fill="#ffffff" opacity="0.12"/>

  <!-- little flowers -->
