  <!-- bottom wave -->
  <path d="M0 215 C 200 175, 380 255, 560 215 S 880 175, 1000 215 L1000 260 L0 260 Z" fill="#ffffff" opacity="0.14"/>

  <text x="500" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Bhoomika Subramanya</text>
  <text x="500" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff" opacity="0.95">Software Developer  ·  AI &amp; Full Stack  ·  Bengaluru</text>
